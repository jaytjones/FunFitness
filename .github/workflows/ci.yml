name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Requires macOS 16 runner (Xcode 26+) for iOS 26.4 SDK.
    # If macos-latest hasn't been updated to macOS 16 yet, pin to macos-16.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FunFitness.xcodeproj \
            -scheme FunFitness \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --report junit --output test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
